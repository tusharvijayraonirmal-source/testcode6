name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:

  ai-code-review:

    runs-on: self-hosted

    steps:

      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Debug checkout
        run: |
          echo "======================================"
          echo "WORKSPACE"
          echo "======================================"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"

          echo "======================================"
          echo "PR INFORMATION"
          echo "======================================"

          echo "PR HEAD SHA:"
          echo "${{ github.event.pull_request.head.sha }}"

          echo "PR HEAD BRANCH:"
          echo "${{ github.event.pull_request.head.ref }}"

          echo "======================================"
          echo "CHECKED OUT COMMIT"
          echo "======================================"

          git rev-parse HEAD

          echo "======================================"
          echo "CLAUDE FILE"
          echo "======================================"

          if [ -f "$GITHUB_WORKSPACE/scripts/claude_api.py" ]; then
            echo "claude_api.py FOUND"
            ls -lh "$GITHUB_WORKSPACE/scripts/claude_api.py"
          else
            echo "ERROR: claude_api.py NOT FOUND"
            echo "Searching:"
            find "$GITHUB_WORKSPACE" \
              -name "claude_api.py" \
              -print

            echo "Tracked review scripts:"
            git ls-files | grep -E 'scripts/.*(claude|ai_code_review)' || true

            exit 1
          fi
      # ------------------------------------------------
      # 2. Get PR information
      # ------------------------------------------------
      - name: Get PR information
        id: pr_info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          echo "BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          echo "HEAD_BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"

          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Base Branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head Branch: ${{ github.event.pull_request.head.ref }}"

      # ------------------------------------------------
      # 3. Setup Python virtual environment
      # ------------------------------------------------
      - name: Setup Python virtual environment
        id: setup_python
        run: |

          echo "Python version:"
          python3 --version

          echo "Creating virtual environment..."

          rm -rf .venv

          python3 -m venv .venv

          .venv/bin/python --version

          echo "Upgrading pip..."

          .venv/bin/python -m pip install --upgrade pip

      # ------------------------------------------------
      # 4. Install Python dependencies
      # ------------------------------------------------
      - name: Install dependencies
        id: install_dependencies
        run: |

          echo "Installing dependencies..."

          .venv/bin/python -m pip install -r requirements.txt

          echo "Dependencies installed successfully"

      # ------------------------------------------------
      # 5. Generate PR diff
      # ------------------------------------------------
      - name: Generate PR diff
        id: generate_diff
        run: |

          echo "Fetching base branch..."

          git fetch origin "$BASE_BRANCH"

          echo "Generating PR diff..."

          git diff \
            "origin/$BASE_BRANCH...HEAD" \
            > pr_diff.txt

          echo "Diff generated"

          echo "Diff lines:"
          wc -l pr_diff.txt

          echo "Changed files:"
          git diff \
            --name-only \
            "origin/$BASE_BRANCH...HEAD"

          if [ ! -s pr_diff.txt ]; then
            echo "WARNING: PR diff is empty"
          fi

      # ------------------------------------------------
      # 6. Validate Claude API configuration
      # ------------------------------------------------
      - name: Validate Claude configuration
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

        run: |

          echo "Validating Claude configuration..."

          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ERROR: ANTHROPIC_AUTH_TOKEN is not configured"
            exit 1
          fi

          if [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "ERROR: ANTHROPIC_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$ANTHROPIC_MODEL" ]; then
            echo "ERROR: ANTHROPIC_MODEL is not configured"
            exit 1
          fi

          echo "Claude authentication: configured"
          echo "Claude base URL: $ANTHROPIC_BASE_URL"
          echo "Claude model: $ANTHROPIC_MODEL"
       
        
      # ------------------------------------------------
      # 7. Claude AI Code Review
      # ------------------------------------------------
      - name: Claude AI Code Review
        id: claude_review

        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}

        run: |

          echo "======================================"
          echo "Starting Claude AI Code Review"
          echo "======================================"

          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ERROR: ANTHROPIC_AUTH_TOKEN is empty"
            exit 1
          fi

          echo "Claude authentication: configured"
          echo "Claude base URL: $ANTHROPIC_BASE_URL"
          echo "Claude model: $ANTHROPIC_MODEL"

          .venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/claude_api.py" \
            --diff "$GITHUB_WORKSPACE/pr_diff.txt" \
            --pr-number "$PR_NUMBER" \
            --repository "$REPOSITORY"

      # ------------------------------------------------
      # 8. Validate Review Result
      # ------------------------------------------------
      - name: Validate review result
        id: validate_review
        run: |

          echo "Validating review_result.json..."

          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is empty"
            exit 1
          fi

          .venv/bin/python -m json.tool review_result.json > /dev/null

          echo "Review JSON is valid"

      # ------------------------------------------------
      # 9. Publish review to GitHub PR
      # ------------------------------------------------
      - name: Publish AI Review
        id: publish_review

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |

          echo "Publishing AI review to GitHub..."

          .venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/publish_review.py" \
            --pr-number "$PR_NUMBER" \
            --review-file review_result.json

          echo "Review published successfully"

      # ------------------------------------------------
      # 10. Send reviewer notification
      # ------------------------------------------------
      - name: Send reviewer notification
        id: reviewer_notification

        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}

        run: |

          echo "Sending reviewer notification..."

          .venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/send_review_email.py" \
            --review-file review_result.json \
            --pr-number "$PR_NUMBER" \
            --repository "${{ github.repository }}"

          echo "Reviewer notification sent"

      # ------------------------------------------------
      # 11. Auto merge
      # ------------------------------------------------
      # DISABLED FOR POC
      #
      # Enable only after:
      # - Claude review validated
      # - Human approval implemented
      # - CI tests implemented
      # - Security checks implemented
