      #   id: auto_merge
      #   if: success()
      #
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #
      #   run: |
      #
      #     .venv/bin/python \
      #       scripts/merge_if_approved.py \
      #       --review-file review_result.json \
      #       --pr-number "$PR_NUMBER"
